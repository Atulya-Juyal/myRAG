[project]
name = "myrag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.3",
    "langchain-anthropic>=1.4.4",
    "langchain-google-genai>=4.2.4",
    "langgraph>=1.2.4",
    "langsmith>=0.8.9",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "slowapi>=0.1.9",
    "uvicorn>=0.49.0",
    "pdfplumber>=0.11.0",
    "langchain-text-splitters>=0.2.0",
    "aiofiles>=23.2.1",
    "numpy>=1.26.0",
    "python-multipart>=0.0.18",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.2.5",
    "langchain-community>=0.4.2",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::Warning",
]

